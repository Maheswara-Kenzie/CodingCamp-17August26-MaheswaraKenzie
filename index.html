<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Expense Tracker</h1>
      <!-- total balance card -->
      <div class="balance-card">
        <h2>Total Pengeluaran</h2>
        <p id="total-balance">Rp 0</p>
      </div>
    </header>

    <main>
      <!-- input form -->
      <section class="card">
        <h3>Tambah Transaksi Anda</h3>
        <form id="transaction-form">
          <div class="form-group">
            <label for="item-name">Nama Barang / Transaksi</label>
            <input type="text" id="item-name" placeholder="Misal: Nasi Goreng" required>
          </div>
          <div class="form-group">
            <label for="item-amount">Jumlah (Rp)</label>
            <input type="number" id="item-amount" placeholder="Misal: 25000" min="1" required>
          </div>
          <div class="form-group">
            <label for="item-category">Kategori</label>
            <select id="item-category" required>
              <option value="" disabled selected>Pilih Kategori</option>
              <option value="Makanan">Makanan</option>
              <option value="Transportasi">Transportasi</option>
              <option value="Hiburan">Hiburan</option>
              <option value="Kultur">Kultur</option>
              <option value="Kecantikan">Kecantikan</option>
              <option value="Hadiah">Hadiah</option>
              <option value="Kesehatan">Kesehatan</option>
              <option value="Pendidikan">Pendidikan</option>
            </select>
          </div>
          <button type="submit" class="btn-submit">Tambah Transaksi</button>
        </form>
      </section>

      <!-- OPTIONAL CHALLENGES: highlight spending limit settings -->
      <section class="card limit-section">
        <label for="budget-limit">Batasi Pengeluaran per Transaksi (Rp):</label>
        <input type="number" id="budget-limit" placeholder="Misal: 100000" min="0">
      </section>

      <!-- visual chart section -->
      <section class="card">
        <h3>Distribusi Pengeluaran</h3>
        <div class="chart-container">
          <canvas id="spending-chart"></canvas>
        </div>
      </section>

      <!-- OPTIONAL CHALLENGES: monthly summary view -->
      <section class="card">
        <h3>Ringkasan Bulanan</h3>
        <div class="filter-group">
          <label for="month-filter">Filter Bulan:</label>
          <input type="month" id="month-filter">
        </div>
        <p class="summary-text">Total Bulan Ini: <strong id="monthly-total">Rp 0</strong></p>
      </section>

      <!-- transaction list section -->
      <section class="card">
        <div class="list-header">
          <h3>Riwayat Transaksi</h3>
          <!-- OPTIONAL CHALLENGES: sort transactions -->
          <div class="sort-group">
            <label for="sort-select">Urutkan:</label>
            <select id="sort-select">
              <option value="date-desc">Terbaru</option>
              <option value="amount-high">Jumlah (Tertinggi)</option>
              <option value="amount-low">Jumlah (Terendah)</option>
              <option value="category">Kategori</option>
            </select>
          </div>
        </div>
        
        <div class="scrollable-list">
          <ul id="transaction-list">
            <!-- transaksi di-render lewat JS -->
          </ul>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
